[project]
name = "krety-t2"
version = "0.1.0"
description = "Code completion context engine for EnsembleAI competition"
requires-python = ">=3.11"
dependencies = [
    "jsonlines>=4.0.0",
    "tqdm>=4.67.1",
    "rank-bm25>=0.2.2",
    "matplotlib>=3.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core"]

[tool.uv]
package = false
